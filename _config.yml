title: Masruk Habib
description: Writing on LLMs, applied ML research and building a business, by Masruk Habib.
url: https://masrukhabib.github.io
author:
  name: Masruk Habib
  twitter: masruk_habib
twitter:
  username: masruk_habib
lang: en

# Google Scholar link used in the hero, Research section and footer.
# Swap in the profile URL (https://scholar.google.com/citations?user=...) when ready.
scholar_url: "https://scholar.google.com/scholar?q=author%3A%22Masruk+Habib%22"

permalink: /blog/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
feed:
  path: blog/feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      blog: true
  - scope:
      path: "blog"
    values:
      blog: true

exclude:
  - README.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
