<!DOCTYPE html>
<html lang="en">

  {%- if page.url == "/" %}

</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  {%- if page.blog %}
  <script src="{{ '/js/blog.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  {%- endif %}

</html>
